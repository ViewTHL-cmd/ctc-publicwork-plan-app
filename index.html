<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกแบบแปลนงานก่อสร้าง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Global Loader (สำหรับบังจอตอนโหลด) -->
    <div id="globalLoader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <p id="loaderText">กำลังประมวลผล...</p>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer"></div>

    <nav class="glass-nav">
        <div class="logo">Construction Plans</div>
        <div class="nav-links">
            <button onclick="App.navigate('dashboard')">หน้าแรก</button>
            <button onclick="App.navigate('search')">ค้นหาข้อมูล</button>
            <button id="nav-add-btn" class="hidden" onclick="App.navigate('add-form')">เพิ่มข้อมูล</button>
            <button id="login-btn" onclick="App.toggleLogin()">สำหรับเจ้าหน้าที่</button>
            <button id="logout-btn" class="hidden" onclick="App.logout()">ออกจากระบบ</button>
        </div>
    </nav>

    <main class="container">
        <!-- Dashboard -->
        <section id="dashboard" class="page-section active glass-panel">
            <h2>ภาพรวมโครงการ</h2>
            <div class="summary-cards">
                <div class="card">
                    <h3>จำนวนโครงการทั้งหมด</h3>
                    <p id="total-projects">0</p>
                </div>
                <div class="card">
                    <h3>งบประมาณรวม (บาท)</h3>
                    <p id="total-budget">0</p>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="budgetChart"></canvas>
            </div>
        </section>

        <!-- Add Form -->
        <section id="add-form" class="page-section hidden glass-panel">
            <h2>บันทึกข้อมูลแบบแปลน</h2>
            <form id="constructionForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>ชื่อโครงการ</label>
                        <input type="text" id="projectName" required>
                    </div>
                    <div class="input-group">
                        <label>ปีงบประมาณ</label>
                        <select id="fiscalYear" required>
                            <option value="2569">2569</option>
                            <option value="2568">2568</option>
                            <option value="2567">2567</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>แบบแปลนเลขที่</label>
                        <input type="text" id="planNo" required>
                    </div>
                    <div class="input-group">
                        <label>จำนวนแผ่น</label>
                        <input type="number" id="pages" required min="1">
                    </div>
                    <div class="input-group">
                        <label>งบประมาณ (บาท)</label>
                        <input type="text" id="budget" required onkeyup="App.formatCurrency(this)">
                    </div>
                    <div class="input-group">
                        <label>หน่วยงาน</label>
                        <select id="department" required>
                            <option value="กองช่าง">กองช่าง</option>
                            <option value="สำนักปลัด">สำนักปลัด</option>
                            <option value="กองการศึกษา">กองการศึกษา</option>
                        </select>
                    </div>
                </div>

                <div class="map-section">
                    <label>คลิกบนแผนที่เพื่อปักหมุดที่ตั้งโครงการ</label>
                    <div id="map"></div>
                    <div class="coord-inputs">
                        <input type="text" id="lat" placeholder="ละติจูด" readonly required>
                        <input type="text" id="lng" placeholder="ลองจิจูด" readonly required>
                    </div>
                </div>

                <div class="file-uploads">
                    <div class="input-group">
                        <label>บันทึกขออนุมัติโครงการ (PDF - ไม่เกิน 5MB)</label>
                        <input type="file" id="approvalFile" accept="application/pdf" required>
                    </div>
                    <div class="input-group">
                        <label>แบบแปลน (PDF - ไม่เกิน 5MB)</label>
                        <input type="file" id="planFile" accept="application/pdf" required>
                    </div>
                    <div class="input-group">
                        <label>เอกสารประมาณราคา (PDF - ไม่เกิน 5MB)</label>
                        <input type="file" id="estimateFile" accept="application/pdf" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">บันทึกข้อมูล</button>
            </form>
        </section>

        <!-- Search -->
        <section id="search" class="page-section hidden glass-panel">
            <h2>ค้นหาแบบแปลนโครงการ</h2>
            <div class="search-filters">
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อโครงการ, เลขที่แบบ...">
                <select id="filterYear">
                    <option value="">ทุกปีงบประมาณ</option>
                    <option value="2569">2569</option>
                    <option value="2568">2568</option>
                    <option value="2567">2567</option>
                </select>
            </div>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>ปีงบฯ</th><th>เลขที่แบบ</th><th>ชื่อโครงการ</th><th>งบประมาณ</th><th>เอกสารแนบ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal hidden glass-panel">
        <div class="modal-content">
            <h3>เข้าสู่ระบบสำหรับเจ้าหน้าที่</h3>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            <div class="modal-actions">
                <button onclick="App.login()">Login</button>
                <button class="cancel-btn" onclick="App.toggleLogin()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
